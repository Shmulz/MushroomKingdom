<body>
<title>ממלכת הפטריות - כרזה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* Full-bleed photograph with the content over it, the same treatment as the
     landing page, rather than a photo band above a dark block. Sized for
     reading across a market stall, so everything is larger than on screen. */

  @page { size: A4 portrait; margin: 0; }

  :root {
    --ground:   #171512;
    --mycelium: #F2EDE3;
    --tan:      #A79E8E;
    --ochre:    #C8973F;

    --f-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --f-body:    "Assistant", "Segoe UI", Arial, sans-serif;
    --f-label:   "IBM Plex Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  /* height:100% rather than a fixed 297mm: at 96dpi 297mm rounds up half a
     pixel, which was enough to spill a blank second page out of the PDF. */
  html, body { height: 100%; margin: 0; padding: 0; background: #555; }

  .poster {
    position: relative;
    width: 210mm;
    height: 100%;
    background: var(--ground);
    color: var(--mycelium);
    font-family: var(--f-body);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7mm;
    text-align: center;
    padding: 14mm 12mm;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("/images/landing_bg.jpg");
    background-size: cover;
    background-position: 50% 40%;
    filter: saturate(1.2) brightness(1.07) contrast(1.04);
    z-index: 0;
  }

  /* Dimmed enough for cream type to hold, light enough that the pink survives.
     The bottom is weighted more heavily because the contact details sit there. */
  .poster::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 68% 42% at 50% 38%, rgba(23,21,18,0.66) 0%, rgba(23,21,18,0.22) 68%, rgba(23,21,18,0.06) 100%),
      linear-gradient(to bottom, rgba(23,21,18,0.30) 0%, rgba(23,21,18,0.02) 36%, rgba(23,21,18,0.40) 76%, rgba(23,21,18,0.80) 100%);
    z-index: 1;
  }

  .poster > * { position: relative; z-index: 2; }

  /* A soft shadow buys legibility over a busy photograph without having to
     dim the photograph, which is the thing the poster is selling. */
  .brand, .brand-latin, .claim, .qr-caption, .qr-url, .phone, .social {
    text-shadow: 0 0.6mm 2.6mm rgba(23, 21, 18, 0.75);
  }


  .group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3mm;
  }

  /* logo-cream.png is line art on transparency, so drop-shadow follows the
     alpha channel and shadows every stroke individually rather than casting
     one disc behind the whole seal. Two passes: a tight dark halo hugging each
     line, then a softer one for depth. */
  .seal {
    width: 58mm;
    height: auto;
    display: block;
    flex: none;
    filter:
      drop-shadow(0 0 0.7mm rgba(23, 21, 18, 0.95))
      drop-shadow(0 0.5mm 1.6mm rgba(23, 21, 18, 0.7));
  }

  .brand {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 46pt;
    line-height: 1;
    margin: 1mm 0 0;
  }

  .brand-latin {
    font-family: var(--f-label);
    font-weight: 500;
    font-size: 14pt;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ochre);
    margin: 0;
    direction: ltr;
  }

  .claim {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 24pt;
    color: var(--mycelium);
    margin: 2mm 0 0;
  }

  .qr-panel {
    background: var(--mycelium);
    border-radius: 2mm;
    padding: 3.4mm;
    line-height: 0;
    flex: none;
    box-shadow: 0 4mm 14mm rgba(0, 0, 0, 0.45);
  }

  .qr-panel svg { width: 58mm; height: 58mm; display: block; }

  .qr-caption {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 19pt;
    color: var(--mycelium);
    margin: 0;
  }

  .qr-url {
    font-family: var(--f-label);
    font-size: 12pt;
    letter-spacing: 0.06em;
    color: var(--ochre);
    margin: 0;
    direction: ltr;
  }

  .divider {
    width: 62mm;
    height: 0.6mm;
    background: rgba(242, 237, 227, 0.42);
    border: 0;
    border-radius: 0.3mm;
    margin: 0;
    flex: none;
  }

  .phone {
    display: inline-flex;
    align-items: center;
    gap: 4mm;
    font-weight: 700;
    font-size: 30pt;
    line-height: 1;
    direction: ltr;
  }

  .phone svg { width: 9.6mm; height: 9.6mm; flex: none; color: var(--ochre); }

  .social {
    display: inline-flex;
    align-items: center;
    gap: 3.4mm;
    font-weight: 600;
    font-size: 19pt;
    line-height: 1;
    direction: ltr;
  }

  .ig-mark {
    width: 10.6mm;
    height: 10.6mm;
    flex: none;
    background: var(--ochre);
    border-radius: 2.7mm;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .ig-mark svg { width: 7.2mm; height: 7.2mm; color: var(--ground); }

  /* ---- home print: light ground, photograph reduced to a band ---- */
  html, body { background: #FFFFFF; }

  .poster {
    background: #FFFFFF;
    color: #171512;
    justify-content: flex-start;
    padding: 40mm 12mm 12mm;
    gap: 6mm;
  }

  .poster::before { bottom: auto; height: 64mm; filter: saturate(1.12) contrast(1.02); }

  .poster::after {
    bottom: auto;
    height: 64mm;
    background: linear-gradient(to bottom,
      rgba(255, 255, 255, 0) 52%,
      rgba(255, 255, 255, 0.75) 84%,
      #FFFFFF 100%);
  }

  .seal { filter: none; }

  .brand, .claim, .qr-caption, .phone, .social { color: #171512; text-shadow: none; }
  .brand-latin, .qr-url { color: #8A6420; text-shadow: none; }

  .qr-panel { background: transparent; box-shadow: none; padding: 0; }

  .divider { background: rgba(23, 21, 18, 0.3); }

  .phone svg { color: #8A6420; }
  .ig-mark { background: #8A6420; }
  .ig-mark svg { color: #FFFFFF; }

  /* ---- A5: the A4 sheet scaled, not a second layout ---- */
  @page { size: A5 portrait; margin: 0; }
  html, body { width: 148mm; height: 210mm; overflow: hidden; }
  .sheet { position: relative; width: 148mm; height: 210mm; overflow: hidden; }
  /* Absolute placement, because the document is right-to-left: a 210mm block
     inside a 148mm sheet would otherwise be laid out from the right edge and
     hang off the left, and the transform would then scale from a point that
     is already off the page. That cut a third off the earlier A5. */
  .poster {
    position: absolute;
    top: 0;
    left: 0;
    width: 210mm;
    height: 297mm;
    transform: scale(0.70476);
    transform-origin: top left;
  }
</style>
