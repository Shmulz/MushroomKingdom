<title>ממלכת הפטריות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root {
    --ground:      #171512;
    --mycelium:    #F2EDE3;
    --tan:         #A79E8E;
    --ochre:       #C8973F;
    --hair-strong: rgba(242, 237, 227, 0.28);

    --f-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --f-body:    "Assistant", "Segoe UI", Arial, sans-serif;
    --f-label:   "IBM Plex Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  body { margin: 0; background: var(--ground); color: var(--mycelium); }

  .landing {
    position: relative;
    min-height: 100svh;
    background: var(--ground);
    color: var(--mycelium);
    font-family: var(--f-body);
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.6rem, 4.5vw, 2.4rem);
    text-align: center;
    padding: clamp(2.5rem, 8vw, 4.5rem) 1.5rem;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* The photograph sits behind everything, dimmed just enough that cream
     type holds over it without draining the pink out of the mushrooms. */
  .landing::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("/images/landing_bg.jpg");
    background-size: cover;
    background-position: 50% 42%;
    z-index: 0;
  }

  .landing::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 47%, rgba(23, 21, 18, 0.78) 0%, rgba(23, 21, 18, 0.34) 62%, rgba(23, 21, 18, 0.20) 100%),
      linear-gradient(to bottom, rgba(23, 21, 18, 0.34) 0%, rgba(23, 21, 18, 0.06) 42%, rgba(23, 21, 18, 0.62) 100%);
    z-index: 1;
  }

  .landing > * { position: relative; z-index: 2; }

  /* Two groups, not six floating lines: identity, then the message.
     The spacing does the separating, so no panel or box is needed. */
  .group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }

  /* Over a photograph a 1px hairline at 28% simply disappears, so this one
     is heavier than the equivalent rules on the flat-ground pages. */
  .rule {
    width: clamp(52px, 15vw, 92px);
    height: 2px;
    background: rgba(242, 237, 227, 0.5);
    border: 0;
    border-radius: 1px;
    margin: 0;
  }

  .seal {
    width: clamp(150px, 34vw, 250px);
    height: auto;
    display: block;
    filter: drop-shadow(0 10px 34px rgba(0, 0, 0, 0.6));
  }

  .brand {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: clamp(2.6rem, 9.5vw, 5rem);
    line-height: 1.04;
    margin: 0.3rem 0 0;
    text-wrap: balance;
  }

  .brand-latin {
    font-family: var(--f-label);
    font-size: clamp(0.7rem, 2.5vw, 0.9rem);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--ochre);
    margin: 0.25rem 0 0;
    direction: ltr;
  }

  .claim {
    font-size: clamp(1rem, 3.3vw, 1.15rem);
    color: var(--tan);
    margin: 0.75rem 0 0;
    text-wrap: balance;
  }

  .soon {
    font-family: var(--f-display);
    font-size: clamp(1.6rem, 5.6vw, 2.3rem);
    color: var(--mycelium);
    margin: 0;
    max-width: 22ch;
    text-wrap: balance;
  }

  .soon-sub {
    font-size: clamp(1.12rem, 3.9vw, 1.35rem);
    color: var(--tan);
    margin: 0;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--f-body);
    font-weight: 600;
    font-size: clamp(1rem, 3.4vw, 1.12rem);
    text-decoration: none;
    padding: 0.95rem 2.1rem;
    margin-top: 0;
    border-radius: 999px;
    background: var(--ochre);
    border: 1px solid var(--ochre);
    color: #171512;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .cta svg { width: 17px; height: 17px; flex: none; }

  .cta:hover, .cta:focus-visible {
    background: var(--mycelium);
    border-color: var(--mycelium);
  }

  .cta:focus-visible { outline: 2px solid var(--mycelium); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="landing" dir="rtl" lang="he">

  <div class="group">
    <img class="seal" src="/images/logo-cream.png" alt="ממלכת הפטריות / Mushroom Kingdom">
    <h1 class="brand">ממלכת הפטריות</h1>
    <p class="brand-latin">MUSHROOM KINGDOM</p>
    <p class="claim">פטריות שף בגידול אורגני</p>
  </div>

  <hr class="rule">

  <div class="group">
    <p class="soon">משהו טוב גדל כאן</p>
    <p class="soon-sub">האתר המלא יעלה בקרוב</p>
  </div>

  <a class="cta" href="/catalogue/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 5.2A1.7 1.7 0 0 1 5.7 3.5H10a2.6 2.6 0 0 1 2 1l.1.1.1-.1a2.6 2.6 0 0 1 2-1h4.2A1.7 1.7 0 0 1 20 5.2v12.1a1.7 1.7 0 0 1-1.7 1.7h-4.5a2 2 0 0 0-1.5.7 2 2 0 0 0-1.5-.7H6.3A1.7 1.7 0 0 1 4 17.3Z"></path>
      <path d="M12 6.1v13.6"></path>
    </svg>
    לקטלוג הפטריות
  </a>

</div>
