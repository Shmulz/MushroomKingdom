<title>ממלכת הפטריות - כרזה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  /* Sized for reading across a market stall, not for reading in the hand.
     Every element here is deliberately larger than it would be on screen. */

  @page { size: A4 portrait; margin: 0; }

  :root {
    --ground:      #171512;
    --mycelium:    #F2EDE3;
    --tan:         #A79E8E;
    --ochre:       #C8973F;
    --hair-strong: rgba(242, 237, 227, 0.30);

    --f-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --f-body:    "Assistant", "Segoe UI", Arial, sans-serif;
    --f-label:   "IBM Plex Mono", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; background: #555; }

  .poster {
    width: 210mm;
    height: 297mm;
    background: var(--ground);
    color: var(--mycelium);
    font-family: var(--f-body);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    /* browsers drop dark backgrounds when printing unless told otherwise */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ---------- photograph band ---------- */

  .photo { position: relative; width: 100%; height: 70mm; flex: none; }

  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .photo::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
      rgba(23, 21, 18, 0.10) 0%,
      rgba(23, 21, 18, 0) 40%,
      var(--ground) 99%);
  }

  /* ---------- identity ---------- */

  .seal {
    width: 62mm;
    height: auto;
    display: block;
    margin-top: -23mm;
    position: relative;
    z-index: 2;
  }

  .brand {
    font-family: var(--f-display);
    font-weight: 700;
    font-size: 56pt;
    line-height: 1;
    margin: 4mm 0 0;
  }

  .brand-latin {
    font-family: var(--f-label);
    font-weight: 500;
    font-size: 17pt;
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--ochre);
    margin: 3.5mm 0 0;
    direction: ltr;
  }

  .claim {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 28pt;
    color: var(--mycelium);
    margin: 6mm 0 0;
  }

  /* ---------- the code ---------- */

  .qr-panel {
    background: var(--mycelium);
    border-radius: 2mm;
    padding: 6mm;
    margin-top: 7mm;
    line-height: 0;
  }

  .qr-panel svg { width: 50mm; height: 50mm; display: block; }

  .qr-caption {
    font-family: var(--f-display);
    font-weight: 500;
    font-size: 22pt;
    color: var(--mycelium);
    margin: 4.5mm 0 0;
  }

  .qr-url {
    font-family: var(--f-label);
    font-size: 13pt;
    letter-spacing: 0.06em;
    color: var(--ochre);
    margin: 2.5mm 0 0;
    direction: ltr;
  }

  /* ---------- contact ---------- */

  .contact {
    margin-top: auto;
    width: 100%;
    padding: 6mm 0 9mm;
    border-top: 1px solid rgba(242, 237, 227, 0.16);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4mm;
  }

  .phone {
    display: inline-flex;
    align-items: center;
    gap: 4mm;
    font-family: var(--f-body);
    font-weight: 700;
    font-size: 34pt;
    line-height: 1;
    color: var(--mycelium);
    direction: ltr;
  }

  .phone svg { width: 11mm; height: 11mm; flex: none; color: var(--ochre); }

  .social {
    display: inline-flex;
    align-items: center;
    gap: 3.4mm;
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 20pt;
    line-height: 1;
    color: var(--mycelium);
    direction: ltr;
  }

  /* Solid ochre tile so the Instagram mark is unmistakable at a glance,
     rather than a thin outline that disappears at distance. */
  .ig-mark {
    width: 11mm;
    height: 11mm;
    flex: none;
    background: var(--ochre);
    border-radius: 2.8mm;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .ig-mark svg { width: 7.6mm; height: 7.6mm; color: var(--ground); }
</style>

<div class="poster">

  <div class="photo">
    <img src="images/card_hero.jpg" alt="">
  </div>

  <img class="seal" src="images/logo-cream.png" alt="">

  <h1 class="brand">ממלכת הפטריות</h1>
  <p class="brand-latin">MUSHROOMS KINGDOM</p>

  <p class="claim">פטריות שף בגידול אורגני</p>

  <div class="qr-panel">{{QR}}</div>
  <p class="qr-caption">סרקו לצפייה בקטלוג המלא</p>
  <p class="qr-url">{{URL}}</p>

  <div class="contact">
    <span class="phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.2 3.5h3l1.5 3.8-1.9 1.4a12.5 12.5 0 0 0 5.5 5.5l1.4-1.9 3.8 1.5v3a1.7 1.7 0 0 1-1.9 1.7A16.8 16.8 0 0 1 4.5 5.4 1.7 1.7 0 0 1 6.2 3.5Z"></path>
      </svg>
      052-705-0501
    </span>
    <span class="social">
      <span class="ig-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4"></rect>
          <circle cx="12" cy="12" r="4.4"></circle>
          <circle cx="17.7" cy="6.3" r="1.3" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>
      @mushrooms.kingdomm
    </span>
  </div>

</div>
